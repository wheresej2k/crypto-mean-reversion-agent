name: Crypto mean-reversion paper trade (every 15 min)

on:
  schedule:
    # :03, :18, :33, :48 past every hour - trades on 15-minute bars, so the workflow runs every 15
    # minutes to match. The offset (not exactly :00/:15/:30/:45) avoids the top-of-quarter-hour
    # traffic spike GitHub's own docs warn can delay jobs, and gives each bar a moment to finalize
    # on Kraken's side before we fetch it.
    - cron: "3,18,33,48 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write

env:
  # No exchange API key needed anywhere in this workflow - live prices come from Kraken's public
  # API (kraken_client.py) and trades are simulated locally (paper_broker.py). See README's "Why
  # there's no exchange API key" section.
  # Your choice, not something tune.py/auto_retune.py ever touches. Strategy/risk parameters
  # live in config/params.json instead - see README for why they're kept separate.
  WATCHLIST: BTC/USD,ETH/USD,SOL/USD,LINK/USD,DOGE/USD
  # Which UTC time gets the once-a-day MMS summary (texting every 15-minute run would be spam).
  # Must be an exact HH:MM this workflow actually runs at (see the cron above) - a mismatch here
  # would mean the daily text silently never fires.
  DAILY_SUMMARY_TIME_UTC: "13:03"

jobs:
  trade:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install system fonts (for the summary image)
        run: sudo apt-get update && sudo apt-get install -y fonts-dejavu-core

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run trading bot
        run: python trader.py

      - name: Rebuild the static dashboard (docs/index.html, served by GitHub Pages)
        run: python build_dashboard.py

      - name: Check if it's time for the once-a-day summary text
        id: check_time
        run: |
          NOW=$(date -u +%H:%M)
          if [ "$NOW" = "$DAILY_SUMMARY_TIME_UTC" ]; then
            echo "is_summary_time=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_summary_time=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Text the daily summary image to phone
        if: steps.check_time.outputs.is_summary_time == 'true'
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PHONE_MMS_ADDRESS: ${{ secrets.PHONE_MMS_ADDRESS }}
        run: python notify.py

      - name: Commit updated trade log and state
        run: |
          git config user.name "crypto-mean-reversion-bot"
          git config user.email "actions@users.noreply.github.com"
          # logs/*.csv is gitignored (keeps local dry-run test logs out of git on your own
          # machine) - -f explicitly overrides that just for the real trade log. state/ files
          # aren't gitignored but may not exist yet on a brand-new repo's first run.
          for f in logs/trade_log.csv state/paper_state.json state/last_success.json docs/index.html; do
            if [ -f "$f" ]; then
              git add -f "$f"
            fi
          done
          git diff --cached --quiet || git commit -m "Update trade log and state [skip ci]"
          git push
