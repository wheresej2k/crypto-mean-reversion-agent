name: Crypto mean-reversion bot watchdog

on:
  schedule:
    # Every 15 min at :10, :25, :40, :55 - offset from the trading job's :03/:18/:33/:48 so it
    # isn't checking mid-run. Runs independently of the trade workflow on purpose - if THAT
    # workflow's schedule silently fails to fire (a real, confirmed GitHub Actions failure mode -
    # see the sibling crypto-trading-agent project's history), this one still runs and notices,
    # because it doesn't depend on the same trigger. Checking this often is what makes a
    # 30-minute alert threshold (below) actually catchable at this bot's cadence.
    - cron: "10,25,40,55 * * * *"
  workflow_dispatch: {}

env:
  # 0.5 hours (30 min) means roughly "2 consecutive missed 15-minute runs" gets caught, scaled
  # down from the sibling bot's 2-hour/hourly-cadence threshold to match this bot running 4x
  # more often.
  WATCHDOG_ALERT_AFTER_HOURS: "0.5"

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # No pip install needed - watchdog.py and heartbeat.py only use the Python standard
      # library, deliberately, so this check has as few ways to fail as possible.
      - name: Check for a missed run
        env:
          GMAIL_ADDRESS: ${{ secrets.GMAIL_ADDRESS }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          PHONE_MMS_ADDRESS: ${{ secrets.PHONE_MMS_ADDRESS }}
        run: python watchdog.py
